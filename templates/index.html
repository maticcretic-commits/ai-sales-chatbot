<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SalesBot Demo — AI Sales Chatbot</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="page">
  <header>
    <h1>⚡ SalesBot</h1>
    <p class="sub">AI sales chatbot — product Q&amp;A, recommendations, lead capture &amp; human handoff</p>
  </header>

  <div class="chat-shell">
    <div class="chat-header">
      <span class="dot"></span> Sales Assistant <span class="online">online</span>
    </div>
    <div id="chat" class="chat"></div>
    <div class="quick">
      <button data-msg="Hi">👋 Hi</button>
      <button data-msg="I need wireless earbuds under $100">🎧 Earbuds &lt; $100</button>
      <button data-msg="That's too expensive">💸 Too expensive?</button>
      <button data-msg="How long is shipping?">📦 Shipping?</button>
      <button data-msg="Talk to a human">🧑 Human</button>
    </div>
    <form id="form" class="input-row">
      <input id="input" type="text" placeholder="Ask about products, prices, shipping…" autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </div>

  <footer>
    <p>Embed this widget on any site with one script tag. WhatsApp version runs on the <code>/whatsapp</code> webhook.</p>
  </footer>
</div>

<script>
(function () {
  const chat = document.getElementById('chat');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  let sessionId = localStorage.getItem('salesbot_session') || null;

  function addMsg(text, who) {
    const div = document.createElement('div');
    div.className = 'msg ' + who;
    div.innerHTML = text
      .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
      .replace(/`(.+?)`/g, '<code>$1</code>');
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  async function send(text) {
    text = (text || '').trim();
    if (!text) return;
    addMsg(text, 'user');
    input.value = '';
    const typing = document.createElement('div');
    typing.className = 'msg bot typing';
    typing.textContent = '…';
    chat.appendChild(typing);
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, session_id: sessionId })
      });
      const data = await res.json();
      sessionId = data.session_id;
      localStorage.setItem('salesbot_session', sessionId);
      typing.remove();
      addMsg(data.reply, 'bot');
    } catch (e) {
      typing.remove();
      addMsg('Sorry, I lost connection. Please try again.', 'bot');
    }
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    send(input.value);
  });
  document.querySelectorAll('.quick button').forEach(function (b) {
    b.addEventListener('click', function () { send(b.dataset.msg); });
  });

  // Greeting on load
  send('Hi');
})();
</script>
</body>
</html>
